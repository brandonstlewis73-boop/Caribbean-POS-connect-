  <text x="500" y="735" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="118" font-weight="900" fill="#ffffff" stroke="#001455" stroke-width="18" paint-order="stroke">Caribbean</text>
  <text x="350" y="870" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="134" font-weight="900" fill="url(#teal)" stroke="#001455" stroke-width="20" paint-order="stroke">POS</text>
