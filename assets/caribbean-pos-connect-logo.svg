<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Caribbean POS Connect logo</title>
  <desc id="desc">A circular Caribbean POS Connect badge with a payment terminal, palm tree, sun, ocean waves, connected nodes, and the tagline Smart POS for Caribbean Business.</desc>
  <defs>
    <linearGradient id="sky" x1="180" x2="830" y1="110" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28f7e8"/>
      <stop offset="0.45" stop-color="#08b7ef"/>
      <stop offset="1" stop-color="#005fd2"/>
    </linearGradient>
    <linearGradient id="sea" x1="120" x2="890" y1="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0eb5ff"/>
      <stop offset="0.5" stop-color="#0274de"/>
      <stop offset="1" stop-color="#0635a2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#18fff0"/>
      <stop offset="1" stop-color="#00a3a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff300"/>
      <stop offset="0.55" stop-color="#ffc000"/>
      <stop offset="1" stop-color="#ff6c00"/>
    </linearGradient>
    <linearGradient id="terminal" x1="410" x2="650" y1="180" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173f9e"/>
      <stop offset="0.5" stop-color="#071f61"/>
      <stop offset="1" stop-color="#020938"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#00144c" flood-opacity="0.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#00144c" flood-opacity="0.3"/>
    </filter>
  </defs>

