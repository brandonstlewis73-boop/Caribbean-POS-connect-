name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: caribbean_pos_connect
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Lint
        run: npm run lint

      - name: Security regression checks
        run: npm run test:security && npm run test:rate-limit

      - name: Tenant isolation and production hardening
        run: npm run test:tenant-isolation && npm run test:production-hardening

      - name: POS and backup boundaries
        run: npm run test:pos && npm run test:backup

      - name: Prepare database
        run: npm run db:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caribbean_pos_connect
          PGSSL_DISABLE: "true"

      - name: Typecheck
        run: npm run typecheck

      - name: Signup and billing guards
        run: npm run test:signup-billing

      - name: PayPal billing verification
        run: npm run test:paypal

      - name: Local AI verification
        run: npm run test:local-ai

      - name: Plan gating
        run: npm run test:plan-gating

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-change-in-production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caribbean_pos_connect
          PGSSL_DISABLE: "true"
