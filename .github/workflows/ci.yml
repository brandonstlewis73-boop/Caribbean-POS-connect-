name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: caribbean_pos_connect
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare database
        run: npm run db:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caribbean_pos_connect
          PGSSL_DISABLE: "true"

      - name: Typecheck
        run: npm run typecheck

      - name: Signup and billing guards
        run: npm run test:signup-billing

      - name: Plan gating
        run: npm run test:plan-gating

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-change-in-production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/caribbean_pos_connect
          PGSSL_DISABLE: "true"
