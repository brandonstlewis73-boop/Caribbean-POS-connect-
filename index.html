<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a22" />
    <title>Savannah & Sea Retail Ltd. | Caribbean POS Connect</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Caribbean POS Connect dashboard">
          <img class="brand-logo-img brand-logo-small" src="./assets/caribbean-pos-connect-logo.svg" alt="" aria-hidden="true" />
          <span>
            <strong>Savannah & Sea</strong>
            <small>Caribbean POS Connect</small>
          </span>
        </a>

        <nav class="nav" id="nav"></nav>

        <section class="location-card">
          <span class="store-icon">POS</span>
          <span>
            <strong id="sidebar-business">Island Bites Cafe</strong>
            <small>Terminal 1 - Online</small>
          </span>
        </section>

        <section class="user-card">
          <span class="avatar">AM</span>
          <label>
            <small>Active role</small>
            <select id="role-select" aria-label="Active role">
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="cashier">Cashier</option>
              <option value="driver">Delivery driver</option>
              <option value="staff">Staff</option>
            </select>
          </label>
        </section>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="business-selector" type="button">
              <span class="pin-dot"></span>
              <span id="top-business">Island Bites Cafe - San Fernando</span>
              <span class="chevron">v</span>
            </button>
            <div>
              <p class="country-label">Trinidad and Tobago</p>
              <h1 id="page-title">Dashboard</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <div class="clock-card">
              <strong id="clock-time">--:--</strong>
              <small id="clock-date">Today</small>
            </div>
            <button class="notification-button" type="button" aria-label="Notifications">
              <span>!</span>
            </button>
            <a class="button secondary" href="#online">Online order page</a>
            <button class="button ghost" id="theme-toggle" type="button">Dark mode</button>
          </div>
        </header>

        <main id="main" class="main"></main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="receipt-dialog" class="receipt-dialog">
      <div class="dialog-head no-print">
        <strong>Receipt</strong>
        <button class="icon-button" type="button" data-close-receipt aria-label="Close receipt">x</button>
      </div>
      <div id="receipt-content" class="receipt-content print-sheet"></div>
      <div class="dialog-actions no-print">
        <button class="button secondary" type="button" data-print-receipt>Print</button>
        <button class="button primary" type="button" data-download-receipt>Download receipt</button>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
